---
layout: default
---
<article class="post">
  <header class="post-head">
    <span class="post-date">{{ page.date | date: "%B %-d, %Y" }}{% if page.author %} · {{ page.author }}{% endif %}</span>
    <h1>{{ page.title }}</h1>
    {% if page.tags.size > 0 %}
    <ul class="post-tags">
      {% for tag in page.tags %}<li>{{ tag }}</li>{% endfor %}
    </ul>
    {% endif %}
  </header>
  <div class="post-body">
{{ content }}
  </div>
  <footer class="post-foot">
    <a href="/blog/">← All posts</a>
    <a href="/#contact">Discuss your project →</a>
  </footer>
</article>
